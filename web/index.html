<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https://*.run.app https://storage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>LifeNest AI</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⌂</span>
      <div>
        <h1>LifeNest AI</h1>
        <p class="tagline" data-i18n="app_tagline"></p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="profile-status" class="chip" data-status="EMPTY"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ms">BM</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2 data-i18n="upload_title"></h2>
        <p class="muted" data-i18n="upload_hint"></p>
        <label class="field">
          <select id="doc-kind">
            <option value="payslip" data-i18n="kind_payslip"></option>
            <option value="epf_statement" data-i18n="kind_epf_statement"></option>
            <option value="loan_statement" data-i18n="kind_loan_statement"></option>
          </select>
        </label>
        <label class="button file-button">
          <input id="doc-file" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" capture="environment">
          <span data-i18n="choose_file"></span>
        </label>
      </section>

      <section class="panel">
        <h2 data-i18n="demo_title"></h2>
        <div class="row">
          <select id="demo-id" aria-label="Demo profile">
            <option value="aina">Aina, 29</option>
            <option value="kumar">Kumar, 41</option>
            <option value="mei">Mei, 34</option>
          </select>
          <button type="button" id="demo-load" class="button secondary" data-i18n="demo_load"></button>
        </div>
      </section>

      <section class="panel">
        <button type="button" id="delete-data" class="button danger" data-i18n="delete"></button>
        <p id="service-info" class="muted small"></p>
      </section>
    </aside>

    <section class="chat">
      <div id="transcript" class="transcript" aria-live="polite"></div>
      <div id="quick" class="quick"></div>
      <form id="composer" class="composer">
        <textarea id="message" rows="2" maxlength="2000" required></textarea>
        <button type="submit" class="button" data-i18n="send"></button>
      </form>
    </section>
  </main>

  <footer class="disclaimer" data-i18n="disclaimer"></footer>
</body>
</html>
