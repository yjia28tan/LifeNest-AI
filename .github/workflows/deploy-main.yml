name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifenest-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,gcp]"
      - run: ruff check app tests scripts
      - run: pytest -p no:warnings

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: lifenest-ai
      FIRESTORE_DATABASE: lifenest-db
      REGION: asia-southeast1
      GEMINI_MODEL: gemini-3.5-flash
      EMBEDDING_MODEL: text-embedding-005
      SKIP_INFRA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/94512454322/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: lifenest-deploy@lifenest-ai.iam.gserviceaccount.com
          project_id: lifenest-ai
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: lifenest-ai
      - run: python -m pip install -e ".[gcp]"
      - run: ./deploy.sh
      - run: npm install --global firebase-tools
      - run: firebase deploy --only hosting --project lifenest-ai --non-interactive